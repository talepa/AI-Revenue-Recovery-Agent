services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recovery_user
      POSTGRES_PASSWORD: recovery_pass
      POSTGRES_DB: recovery_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_user -d recovery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://recovery_user:recovery_pass@db:5432/recovery_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
