name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recovery_user
          POSTGRES_PASSWORD: recovery_pass
          POSTGRES_DB: recovery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery_user -d recovery_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Kafka/Redis/OpenAI are intentionally left unconfigured — that's the
      # path the test suite actually exercises (see the auto-fallback
      # pattern in app/agents/llm_client.py, app/events/, app/core/locks.py).
      DATABASE_URL: postgresql+asyncpg://recovery_user:recovery_pass@localhost:5432/recovery_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: alembic upgrade head

      - run: pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
